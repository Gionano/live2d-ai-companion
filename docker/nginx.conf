worker_processes auto;
pid /tmp/amika-nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/amika-client;
  proxy_temp_path /tmp/amika-proxy;
  fastcgi_temp_path /tmp/amika-fastcgi;
  uwsgi_temp_path /tmp/amika-uwsgi;
  scgi_temp_path /tmp/amika-scgi;
  client_max_body_size 128m;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 5173;
    server_name localhost 127.0.0.1;
    if ($http_host !~* "^(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$") { return 403; }
    root /app/dist;

    location /api/ {
      include /app/docker/proxy.conf;
      proxy_pass http://127.0.0.1:8787;
    }
    location = /ws {
      include /app/docker/proxy.conf;
      proxy_pass http://127.0.0.1:8787;
    }
    location /models/ {
      alias /app/public/models/;
      add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 5174;
    server_name localhost 127.0.0.1;
    if ($http_host !~* "^(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$") { return 403; }
    root /app/vision-monitor/dist;

    location = /api/status {
      include /app/docker/proxy.conf;
      proxy_pass http://127.0.0.1:3001;
    }
    location = /ws-monitor {
      include /app/docker/proxy.conf;
      proxy_pass http://127.0.0.1:3001;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
