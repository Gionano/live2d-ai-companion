<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script>
    // The main process supplies the single local backend origin before images load.
    let imageOrigin = 'http://127.0.0.1:8787';
    try {
      const candidate = new URL(new URLSearchParams(location.search).get('imageOrigin') || imageOrigin);
      if (['http:', 'https:'].includes(candidate.protocol)
        && ['localhost', '127.0.0.1', '[::1]'].includes(candidate.hostname)
        && !candidate.username && !candidate.password && candidate.pathname === '/') {
        imageOrigin = candidate.origin;
      }
    } catch {}
    const policy = document.createElement('meta');
    policy.httpEquiv = 'Content-Security-Policy';
    policy.content = `default-src 'self'; img-src ${imageOrigin}; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';`;
    document.head.appendChild(policy);
  </script>
  <title>Amika Selfie</title>
  <style>
    :root {
      --bg-glass: rgba(18, 22, 32, 0.88);
      --border-glass: rgba(110, 190, 255, 0.35);
      --accent: #5ab2ff;
      --accent-glow: rgba(90, 178, 255, 0.4);
      --text: #f0f6fc;
      --text-muted: #8b9bb4;
      --danger: #ff5a79;
      --danger-hover: #ff335a;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.16);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .popup-container {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* --- KEADAAN A: TOAST KOMPAK (GENERATING) --- */
    #state-generating {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 12px 14px;
    }

    .toast-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toast-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .toast-avatar-icon {
      font-size: 16px;
      animation: pulse 1.8s infinite;
    }

    .btn-cancel-small {
      background: rgba(255, 90, 121, 0.15);
      border: 1px solid rgba(255, 90, 121, 0.4);
      color: var(--danger);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel-small:hover {
      background: var(--danger);
      color: white;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0 4px 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      box-shadow: 0 0 8px var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .toast-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* --- KEADAAN B: GAMBAR SELESAI (READY) --- */
    #state-ready {
      display: none;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 14px;
      gap: 10px;
    }

    #state-ready > :not(.image-preview-wrapper) {
      flex-shrink: 0;
    }

    .ready-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ready-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-close-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-close-icon:hover {
      color: var(--text);
      background: var(--btn-hover);
    }

    .image-preview-wrapper {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }

    .selfie-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.5s ease, transform 0.5s ease;
      border-radius: 8px;
    }

    .selfie-image.loaded {
      opacity: 1;
      transform: scale(1);
    }

    .image-status {
      position: absolute;
      padding: 12px;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    button:focus-visible, [role="button"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .caption-box {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      font-style: italic;
      overflow-wrap: anywhere;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 6px;
    }

    .btn-action {
      background: var(--btn-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
    }

    .btn-action.success {
      background: rgba(74, 222, 128, 0.2);
      border-color: rgba(74, 222, 128, 0.4);
      color: #4ade80;
    }

    .auto-close-hint {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
    }

    /* --- OVERLAY ZOOM (ENLARGE S/D 80% LAYAR) --- */
    .zoom-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    .zoom-overlay img {
      max-width: 80vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      animation: zoomIn 0.2s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="popup-container" id="popup-root">

    <!-- KEADAAN A: TOAST KOMPAK (PROGRESS & ETA) -->
    <div id="state-generating">
      <div class="toast-header">
        <div class="toast-title">
          <span class="toast-avatar-icon">📸</span>
          <span>Amika sedang berfoto...</span>
        </div>
        <button class="btn-cancel-small" id="btn-cancel" title="Batalkan foto">Batal</button>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>

      <div class="toast-meta">
        <span id="progress-text">Menyiapkan pose...</span>
        <span id="eta-text">Estimasi belum tersedia</span>
      </div>
    </div>

    <!-- KEADAAN B: GAMBAR SELESAI (PREVIEW & AKSI) -->
    <div id="state-ready">
      <div class="ready-header">
        <div class="ready-title">
          <span>✨</span>
          <span>Foto Baru dari Amika</span>
        </div>
        <button class="btn-close-icon" id="btn-close" title="Tutup">✕</button>
      </div>

      <div class="image-preview-wrapper" id="image-wrapper" role="button" tabindex="0" aria-label="Perbesar foto" title="Klik untuk memperbesar">
        <span class="image-status" id="image-status" role="status">Memuat foto...</span>
        <img class="selfie-image" id="selfie-img" alt="Foto Amika">
      </div>

      <div class="caption-box" id="caption-box">
        "Ini fotonya sayang..."
      </div>

      <div class="action-buttons">
        <button class="btn-action" id="btn-save" title="Simpan file ke komputer">
          <span>💾</span>
          <span>Simpan</span>
        </button>
        <button class="btn-action" id="btn-copy" title="Salin gambar ke clipboard">
          <span>📋</span>
          <span>Salin</span>
        </button>
        <button class="btn-action" id="btn-folder" title="Buka folder foto">
          <span>📁</span>
          <span>Folder</span>
        </button>
      </div>

      <div class="auto-close-hint" id="auto-close-hint" role="status"></div>
    </div>

  </div>

  <!-- ZOOM MODAL (Enlarge) -->
  <div class="zoom-overlay" id="zoom-overlay" role="button" tabindex="-1" aria-label="Kecilkan foto">
    <img id="zoom-img" alt="Foto Amika diperbesar">
  </div>

  <script>
    const stateGen = document.getElementById('state-generating');
    const stateReady = document.getElementById('state-ready');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const etaText = document.getElementById('eta-text');
    const selfieImg = document.getElementById('selfie-img');
    const captionBox = document.getElementById('caption-box');
    const autoCloseHint = document.getElementById('auto-close-hint');
    const zoomOverlay = document.getElementById('zoom-overlay');
    const zoomImg = document.getElementById('zoom-img');
    const imageStatus = document.getElementById('image-status');
    const imageWrapper = document.getElementById('image-wrapper');
    const cancelButton = document.getElementById('btn-cancel');
    const saveButton = document.getElementById('btn-save');
    const copyButton = document.getElementById('btn-copy');
    const folderButton = document.getElementById('btn-folder');
    const actionButtons = [saveButton, copyButton, folderButton];
    const originalButtonContent = new Map(actionButtons.map((button) => [button, button.innerHTML]));

    let currentJobId = null;
    let currentImageUrl = null;
    let currentState = null;
    let autoCloseTimer = null;
    let autoCloseSeconds = 30;
    let configuredAutoCloseSeconds = 30;
    let cardSize = { width: 360, height: 520 };
    const buttonTimers = new Set();

    // Subscribe before the handshake so queued lifecycle events cannot be lost.
    if (window.selfieApi?.onSelfieEvent) {
      window.selfieApi.onSelfieEvent((payload) => {
        if (!payload || typeof payload.jobId !== 'string' || !payload.type) return;
        if (payload.type !== 'selfie_started' && currentJobId && payload.jobId !== currentJobId
          && !(payload.type === 'selfie_ready' && payload.replaceJob === true)) return;

        switch (payload.type) {
          case 'selfie_started':
            if (payload.status === 'queued' || (currentJobId === payload.jobId && currentState === 'generating')) return;
            showGeneratingState(payload);
            break;
          case 'selfie_progress':
            updateProgress(payload);
            break;
          case 'selfie_ready':
            showReadyState(payload);
            break;
          case 'selfie_layout':
            if (currentState === 'ready') applyCardLayout(payload);
            break;
          case 'selfie_failed':
          case 'selfie_cancelled':
            showTerminalState(payload);
            break;
        }
      });
      Promise.resolve(window.selfieApi.ready?.()).catch(() => {
        progressText.textContent = 'Popup belum terhubung. Tutup lalu coba lagi.';
        cancelButton.disabled = true;
      });
    }

    function resetJob(data) {
      clearAutoClose();
      for (const timer of buttonTimers) clearTimeout(timer);
      buttonTimers.clear();
      currentJobId = data.jobId;
      currentImageUrl = null;
      zoomOverlay.style.display = 'none';
      zoomImg.removeAttribute('src');
      selfieImg.onload = null;
      selfieImg.onerror = null;
      selfieImg.removeAttribute('src');
      selfieImg.classList.remove('loaded');
      imageStatus.textContent = 'Memuat foto...';
      imageStatus.style.display = 'block';
      autoCloseHint.textContent = '';
      cancelButton.disabled = false;
      cancelButton.hidden = false;
      cancelButton.textContent = 'Batal';
      for (const button of actionButtons) {
        button.disabled = true;
        button.classList.remove('success');
        button.innerHTML = originalButtonContent.get(button);
      }
    }

    function showGeneratingState(data) {
      resetJob(data);
      currentState = 'generating';
      stateGen.style.display = 'flex';
      stateReady.style.display = 'none';
      progressFill.style.width = '0%';
      progressText.textContent = 'Menyiapkan kamera...';
      const eta = data.etaSeconds;
      etaText.textContent = Number.isFinite(eta) && eta >= 0 ? `Estimasi: ~${eta}s` : 'Estimasi belum tersedia';
    }

    function updateProgress(data) {
      if (currentState !== 'generating') return;
      const raw = Number.isFinite(data.percentage) ? data.percentage : (data.max > 0 ? Math.round((data.value / data.max) * 100) : 0);
      const pct = Number.isFinite(raw) ? Math.min(100, Math.max(0, raw)) : 0;
      progressFill.style.width = `${pct}%`;
      progressText.textContent = `Memproses foto... (${pct}%)`;
    }

    function showReadyState(data) {
      resetJob(data);
      currentState = 'ready';
      currentImageUrl = data.imageUrl;
      applyCardLayout(data);

      stateGen.style.display = 'none';
      stateReady.style.display = 'flex';

      const jobId = currentJobId;
      selfieImg.onload = () => {
        if (currentJobId !== jobId || currentState !== 'ready') return;
        selfieImg.classList.add('loaded');
        imageStatus.style.display = 'none';
        for (const button of actionButtons) button.disabled = false;
      };
      selfieImg.onerror = () => {
        if (currentJobId !== jobId || currentState !== 'ready') return;
        imageStatus.textContent = 'Foto gagal dimuat. Buka Folder untuk melihat hasilnya.';
        folderButton.disabled = false;
      };
      selfieImg.src = data.imageUrl;
      zoomImg.src = data.imageUrl;

      captionBox.textContent = `"${data.caption || 'Ini fotonya buat kamu sayang~'}"`;

      configuredAutoCloseSeconds = Number.isFinite(data.autoCloseSeconds) ? data.autoCloseSeconds : 30;
      startAutoCloseCountdown(configuredAutoCloseSeconds);
    }

    function applyCardLayout(data) {
      const size = data.cardSize || { width: 360, height: 520 };
      if (!data.zoomed) cardSize = size;
      const compact = size.height < 480 || size.width < 300;
      // Captions and action rows can overflow even a full-size card.
      stateReady.style.overflowY = 'auto';
      imageWrapper.style.minHeight = compact ? '64px' : '0';
    }

    function showTerminalState(data) {
      resetJob(data);
      currentState = data.type === 'selfie_cancelled' ? 'cancelled' : 'failed';
      stateGen.style.display = 'flex';
      stateReady.style.display = 'none';
      progressFill.style.width = '0%';
      progressText.textContent = currentState === 'cancelled' ? 'Foto dibatalkan.' : 'Foto gagal dibuat. Silakan coba lagi.';
      etaText.textContent = '';
      cancelButton.disabled = true;
      cancelButton.hidden = true;
    }

    function startAutoCloseCountdown(seconds) {
      clearAutoClose();
      if (!Number.isFinite(seconds) || seconds <= 0) {
        autoCloseHint.textContent = '';
        return;
      }
      autoCloseSeconds = seconds;
      const jobId = currentJobId;
      autoCloseHint.textContent = `Menutup otomatis dalam ${autoCloseSeconds}s`;

      autoCloseTimer = setInterval(() => {
        if (currentJobId !== jobId || currentState !== 'ready') return clearAutoClose();
        autoCloseSeconds -= 1;
        if (autoCloseSeconds <= 0) {
          clearAutoClose();
          hidePopup();
        } else {
          autoCloseHint.textContent = `Menutup otomatis dalam ${autoCloseSeconds}s`;
        }
      }, 1000);
    }

    function clearAutoClose() {
      if (autoCloseTimer) {
        clearInterval(autoCloseTimer);
        autoCloseTimer = null;
      }
      autoCloseHint.textContent = '';
    }

    function hidePopup() {
      clearAutoClose();
      zoomOverlay.style.display = 'none';
      Promise.resolve(window.selfieApi?.closePopup()).catch(() => {
        autoCloseHint.textContent = 'Popup gagal ditutup. Coba lagi.';
      });
    }

    cancelButton.addEventListener('click', async () => {
      if (!currentJobId || currentState !== 'generating' || cancelButton.disabled) return;
      const jobId = currentJobId;
      cancelButton.disabled = true;
      cancelButton.textContent = 'Membatalkan...';
      try {
        const result = await window.selfieApi?.cancelJob(jobId);
        if (currentJobId !== jobId || currentState !== 'generating') return;
        if (result === true || result?.cancelled === true || result?.ok === true) {
          progressText.textContent = 'Menunggu pembatalan...';
          return;
        }
        throw new Error('Cancellation was not accepted');
      } catch {
        if (currentJobId !== jobId || currentState !== 'generating') return;
        progressText.textContent = 'Gagal membatalkan. Coba lagi.';
        cancelButton.disabled = false;
        cancelButton.textContent = 'Coba batal';
      }
    });

    // Tombol Tutup
    document.getElementById('btn-close').addEventListener('click', () => {
      hidePopup();
    });

    function enlargeImage() {
      if (currentState !== 'ready' || !selfieImg.classList.contains('loaded')) return;
      clearAutoClose();
      zoomOverlay.style.display = 'flex';
      window.selfieApi?.resizeWindow(720, 720, true);
      zoomOverlay.focus();
    }

    function shrinkImage() {
      if (zoomOverlay.style.display !== 'flex') return;
      zoomOverlay.style.display = 'none';
      window.selfieApi?.resizeWindow(cardSize.width, cardSize.height, false);
      startAutoCloseCountdown(configuredAutoCloseSeconds);
      imageWrapper.focus();
    }

    imageWrapper.addEventListener('click', enlargeImage);
    imageWrapper.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        enlargeImage();
      }
    });
    zoomOverlay.addEventListener('click', shrinkImage);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (zoomOverlay.style.display === 'flex') shrinkImage();
        else if (currentState !== 'generating') hidePopup();
      }
    });

    function showActionSuccess(button, label, duration) {
      const jobId = currentJobId;
      button.classList.add('success');
      button.textContent = label;
      const timer = setTimeout(() => {
        buttonTimers.delete(timer);
        if (currentJobId !== jobId) return;
        button.classList.remove('success');
        button.innerHTML = originalButtonContent.get(button);
      }, duration);
      buttonTimers.add(timer);
    }

    saveButton.addEventListener('click', async () => {
      if (!currentImageUrl || saveButton.disabled) return;
      clearAutoClose();
      const jobId = currentJobId;
      saveButton.disabled = true;
      try {
        const res = await window.selfieApi?.saveImage(currentImageUrl);
        if (currentJobId !== jobId) return;
        if (res?.saved) showActionSuccess(saveButton, 'Tersimpan', 2500);
        else if (!res?.cancelled) autoCloseHint.textContent = 'Foto gagal disimpan. Coba lagi.';
      } catch {
        if (currentJobId === jobId) autoCloseHint.textContent = 'Foto gagal disimpan. Coba lagi.';
      } finally {
        if (currentJobId === jobId && currentState === 'ready') saveButton.disabled = false;
      }
    });

    copyButton.addEventListener('click', async () => {
      if (!currentImageUrl || copyButton.disabled) return;
      clearAutoClose();
      const jobId = currentJobId;
      copyButton.disabled = true;
      try {
        const result = await window.selfieApi?.copyImage(currentImageUrl);
        if (currentJobId !== jobId) return;
        if (result === true || result?.copied === true || result?.ok === true) showActionSuccess(copyButton, 'Tersalin', 2000);
        else autoCloseHint.textContent = 'Foto gagal disalin. Coba lagi.';
      } catch {
        if (currentJobId === jobId) autoCloseHint.textContent = 'Foto gagal disalin. Coba lagi.';
      } finally {
        if (currentJobId === jobId && currentState === 'ready') copyButton.disabled = false;
      }
    });

    folderButton.addEventListener('click', async () => {
      if (folderButton.disabled) return;
      clearAutoClose();
      const jobId = currentJobId;
      try {
        const result = await window.selfieApi?.openFolder();
        if (currentJobId !== jobId) return;
        if (result === false || result?.ok === false) autoCloseHint.textContent = 'Folder gagal dibuka. Coba lagi.';
      } catch {
        if (currentJobId === jobId) autoCloseHint.textContent = 'Folder gagal dibuka. Coba lagi.';
      }
    });
  </script>
</body>
</html>
