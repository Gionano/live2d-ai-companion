<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1472" width="1440" height="1472" role="img" aria-labelledby="architecture-title architecture-description" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="architecture-title">Amika AI Companion system architecture</title>
  <desc id="architecture-description">Browser and Electron clients use WebSocket and HTTP proxies to the Node.js backend. Cloud services provide transcription, vision, chat and planning, spontaneous filtering, and speech. PAP branches before ordinary chat and runs asynchronous local jobs through existing ComfyUI, managed ComfyUI, or sd.cpp. Results use WebSocket events and token HTTP images. The optional Vision Monitor connects through its own bridge and enables continuous vision.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202638"/>
      <stop offset="100%" stop-color="#171c2a"/>
    </linearGradient>
    <linearGradient id="photo-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#302036"/>
      <stop offset="100%" stop-color="#201925"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#a5b4c8"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#f472b6"/>
    </marker>
    <style>
      .boundary { fill: #111622; stroke: #344158; stroke-width: 1.5; }
      .node { fill: url(#card); stroke: #40516c; stroke-width: 1.3; }
      .active { stroke: #38bdf8; }
      .photo { fill: url(#photo-card); stroke: #f472b6; stroke-width: 1.3; }
      .heading { fill: #f1f5f9; font-size: 21px; font-weight: 700; }
      .label { fill: #e2e8f0; font-size: 18px; font-weight: 600; }
      .detail { fill: #b8c5d8; font-size: 16px; }
      .small { fill: #a5b4c8; font-size: 14px; }
      .mono { font-family: Consolas,'Liberation Mono',monospace; font-size: 14px; fill: #cbd5e1; }
      .main-flow { fill: none; stroke: #38bdf8; stroke-width: 2; }
      .optional-flow { fill: none; stroke: #a5b4c8; stroke-width: 2; stroke-dasharray: 6 5; }
      .photo-flow { fill: none; stroke: #f472b6; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1440" height="1472" rx="16" fill="#0f1117"/>
  <text x="32" y="46" fill="#f8fafc" font-size="28" font-weight="700">AMIKA AI COMPANION</text>
  <text x="32" y="76" fill="#b8c5d8" font-size="18">System architecture &#183; voice, vision, memory, local PAP generation, and desktop integration</text>

  <!-- Runtime boundaries. Cloud integrations and local providers are called by the backend. -->
  <rect class="boundary" x="32" y="108" width="304" height="890" rx="14"/>
  <rect class="boundary" x="426" y="108" width="550" height="890" rx="14"/>
  <rect class="boundary" x="1078" y="108" width="330" height="890" rx="14"/>
  <rect class="boundary" x="32" y="1040" width="304" height="346" rx="14"/>
  <rect x="426" y="1040" width="982" height="346" rx="14" fill="#17131e" stroke="#80506d" stroke-width="1.5"/>
  <text class="heading" x="56" y="143">COMPANION CLIENTS</text>
  <text class="heading" x="452" y="143">NODE.JS BACKEND &#183; :8787</text>
  <text class="heading" x="1102" y="143">CLOUD SERVICES</text>
  <text class="heading" x="56" y="1075">VISION MONITOR</text>
  <text class="heading" x="452" y="1075">LOCAL IMAGE GENERATION</text>
  <text class="small" x="452" y="1100">Automatic failover only before generation starts &#183; references and image models stay local</text>

  <!-- Connectors sit behind cards. -->
  <g aria-label="Client and backend connections">
    <path class="main-flow" d="M 312 458 H 392 V 215 H 452" marker-end="url(#arrow-blue)"/>
    <text class="small" x="350" y="203">voice / text</text>
    <path class="main-flow" d="M 312 504 H 370 V 366 H 452" marker-end="url(#arrow-blue)"/>
    <text class="small" x="374" y="352">frames</text>
    <path class="main-flow" d="M 452 782 H 392 V 653 H 312" marker-end="url(#arrow-blue)"/>
    <text class="small" x="345" y="639">audio / cues</text>
    <path class="photo-flow" d="M 312 922 H 452" marker-start="url(#arrow-pink)" marker-end="url(#arrow-pink)"/>
    <text class="small" x="342" y="907">events / HTTP</text>
  </g>
  <g aria-label="Backend data flow">
    <!-- PAP is routed before normal conversation; vision is optional. -->
    <path class="photo-flow" d="M 510 272 V 292 H 440 V 912 H 452" marker-end="url(#arrow-pink)"/>
    <path class="main-flow" d="M 780 272 H 964 V 509 H 950" marker-end="url(#arrow-blue)"/>
    <path class="optional-flow" d="M 702 272 V 318" marker-end="url(#arrow-gray)"/>
    <text class="small" x="718" y="301">optional vision context</text>
    <path class="main-flow" d="M 702 414 V 462" marker-end="url(#arrow-blue)"/>
    <text class="small" x="718" y="445">frame description</text>
    <path class="optional-flow" d="M 510 414 V 436 H 448 V 650 H 452" marker-end="url(#arrow-gray)"/>
    <path class="main-flow" d="M 780 556 H 958 V 762 H 950" marker-end="url(#arrow-blue)"/>
    <path class="optional-flow" d="M 702 694 V 740" marker-end="url(#arrow-gray)"/>
    <text class="small" x="718" y="725">COMMENT &#8594; speech</text>
    <path class="photo-flow" d="M 576 862 V 824" marker-end="url(#arrow-pink)"/>
    <text class="small" x="590" y="846">start / caption / failure</text>
    <path class="photo-flow" d="M 702 972 V 1030 H 438 V 1145 H 452" marker-start="url(#arrow-pink)" marker-end="url(#arrow-pink)"/>
    <text class="small" x="716" y="1021">jobs / results</text>
  </g>
  <g aria-label="Cloud API connections">
    <path class="main-flow" d="M 950 215 H 1102" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <text class="small" x="992" y="201">audio / text</text>
    <path class="main-flow" d="M 950 366 H 1102" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <text class="small" x="992" y="352">frame / text</text>
    <path class="main-flow" d="M 950 509 H 1102" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <text class="small" x="992" y="495">chat stream</text>
    <path class="photo-flow" d="M 950 890 H 982 V 534 H 1102" marker-start="url(#arrow-pink)" marker-end="url(#arrow-pink)"/>
    <text class="small" x="993" y="880">scene plan</text>
    <path class="optional-flow" d="M 950 650 H 1102" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>
    <text class="small" x="992" y="636">buffer / JSON</text>
    <path class="main-flow" d="M 950 782 H 1102" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <text class="small" x="992" y="768">text / MP3</text>
  </g>
  <g aria-label="Optional monitor connection and local provider execution">
    <path class="optional-flow" d="M 184 1212 V 1240" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>
    <path class="optional-flow" d="M 312 1284 H 380 V 986 H 426" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>
    <path class="photo-flow" d="M 593 1170 V 1188" marker-end="url(#arrow-pink)"/>
    <path class="photo-flow" d="M 909 1170 V 1188" marker-end="url(#arrow-pink)"/>
    <path class="photo-flow" d="M 1225 1170 V 1188" marker-end="url(#arrow-pink)"/>
    <path class="photo-flow" d="M 593 1284 V 1310" marker-end="url(#arrow-pink)"/>
    <path class="photo-flow" d="M 909 1284 V 1310" marker-end="url(#arrow-pink)"/>
    <path class="photo-flow" d="M 1225 1284 V 1310" marker-end="url(#arrow-pink)"/>
  </g>

  <!-- The same renderer runs in a browser or in the isolated Electron overlay. -->
  <g aria-label="Companion clients">
    <rect class="node" x="56" y="162" width="256" height="104" rx="8"/>
    <text class="label" x="72" y="190">Browser / Vite &#183; :5173</text>
    <text class="detail" x="72" y="216">Shared Live2D renderer</text>
    <text class="mono" x="72" y="242">/ws + /api &#8594; backend</text>

    <rect class="node" x="56" y="290" width="256" height="112" rx="8"/>
    <text class="label" x="72" y="318">Electron overlay</text>
    <text class="detail" x="72" y="344">Dev: Vite; packaged: local</text>
    <text class="detail" x="72" y="367">static server + API/WS proxy</text>
    <text class="small" x="72" y="390">Isolated, sandboxed preload IPC</text>

    <rect class="node" x="56" y="426" width="256" height="144" rx="8"/>
    <text class="label" x="72" y="453">Input and capture</text>
    <text class="detail" x="72" y="479">Mic: VAD / mobile PTT</text>
    <text class="detail" x="72" y="502">Desktop typed text</text>
    <text class="detail" x="72" y="525">Webcam / browser screen share</text>
    <text class="small" x="72" y="551">Electron: protected direct capture</text>

    <rect x="56" y="608" width="256" height="126" rx="8" fill="url(#card)" stroke="#4ade80" stroke-width="1.3"/>
    <text class="label" x="72" y="637" style="fill:#4ade80">Live2D and playback</text>
    <text class="detail" x="72" y="663">Sentence audio + captions</text>
    <text class="detail" x="72" y="686">Mouth envelope lip sync</text>
    <text class="detail" x="72" y="710">12 emotion cues + turn state</text>

    <rect class="photo" x="56" y="862" width="256" height="110" rx="8"/>
    <text class="label" x="72" y="889" style="fill:#f472b6">PAP photo display</text>
    <text class="detail" x="72" y="912">Browser dialog / Electron popup</text>
    <text class="detail" x="72" y="935">Progress, cancel, reconnect</text>
    <text class="small" x="72" y="958">Token HTTP images &#183; save / copy</text>
    <text class="small" x="56" y="782">Electron tray gates Screen Vision.</text>
    <text class="small" x="56" y="805">Overlay and popup are excluded</text>
    <text class="small" x="56" y="828">from desktop screen capture.</text>
  </g>

  <!-- Orchestration owns routing, local state, job admission, and shared speech. -->
  <g aria-label="Node.js orchestration">
    <rect class="node active" x="452" y="162" width="498" height="110" rx="8"/>
    <text class="label" x="470" y="190">Voice / text ingress and turn routing</text>
    <text class="detail" x="470" y="216">Speech &#8594; STT; typed text bypasses transcription</text>
    <text class="detail" x="470" y="240">PAP intent branches before ordinary conversation</text>
    <text class="small" x="470" y="261">Per-client turn cancellation and busy-input handling</text>

    <rect class="node active" x="452" y="318" width="498" height="96" rx="8"/>
    <text class="label" x="470" y="346">Vision routing and continuous frame descriptions</text>
    <text class="detail" x="470" y="372">On demand: webcam / screen; context can use recent buffer</text>
    <text class="small" x="470" y="398">Continuous processing requires an active source + monitor</text>

    <rect class="node active" x="452" y="462" width="498" height="94" rx="8"/>
    <text class="label" x="470" y="490">Chat, persona, and conversation history</text>
    <text class="detail" x="470" y="515">Stream replies; extract facts and episodes in background</text>
    <text x="470" y="540" fill="#c4b5fd" font-size="16">Local recall / persistence: data/memory.json</text>

    <rect class="node" x="452" y="608" width="498" height="86" rx="8"/>
    <text class="label" x="470" y="636">Continuous buffer and spontaneous filter</text>
    <text class="detail" x="470" y="661">COMMENT &#8594; shared speech queue; SKIP &#8594; no speech</text>
    <text class="small" x="470" y="683">Comment text goes directly to speech; history is updated</text>

    <rect class="node active" x="452" y="740" width="498" height="84" rx="8"/>
    <text class="label" x="470" y="768">Shared speech controller and streaming TTS</text>
    <text class="detail" x="470" y="793">Chat, spontaneous comments, and deferred PAP captions</text>
    <text class="small" x="470" y="814">Serialized playback &#183; completion acknowledgments / timeout</text>

    <rect class="photo" x="452" y="862" width="498" height="110" rx="8"/>
    <text class="label" x="470" y="889" style="fill:#f472b6">PAP admission, scene planning, and async jobs</text>
    <text class="detail" x="470" y="913">Readiness &#8594; cloud planner &#8594; whitelist / moderation / prompt</text>
    <text class="detail" x="470" y="936">One active job + queue &#183; limits &#183; progress / ETA &#183; cancellation</text>
    <text class="mono" x="470" y="959">selfie_* /ws events + /api/selfies/:token HTTP images</text>
  </g>

  <g aria-label="Backend-only cloud integrations">
    <rect class="node active" x="1102" y="162" width="282" height="110" rx="8"/>
    <text class="label" x="1120" y="192">Groq &#183; Whisper</text>
    <text class="mono" x="1120" y="219">whisper-large-v3</text>
    <text class="detail" x="1120" y="248">Indonesian speech-to-text</text>

    <rect class="node active" x="1102" y="318" width="282" height="96" rx="8"/>
    <text class="label" x="1120" y="347">Groq &#183; Qwen vision</text>
    <text class="mono" x="1120" y="373">qwen/qwen3.8-27b</text>
    <text class="detail" x="1120" y="397">Frame perception</text>

    <rect class="node active" x="1102" y="462" width="282" height="94" rx="8"/>
    <text class="label" x="1120" y="489">Experiential Labs</text>
    <text class="mono" x="1120" y="514">deepseek-v4.1-flash-uncensored</text>
    <text class="small" x="1120" y="540">Override: EXPLABS_MODEL</text>

    <rect class="node" x="1102" y="608" width="282" height="86" rx="8"/>
    <text class="label" x="1120" y="636">9inference &#183; moment filter</text>
    <text class="mono" x="1120" y="661">deepseek-v4.1-flash</text>
    <text class="small" x="1120" y="683">Returns COMMENT or SKIP JSON</text>

    <rect class="node active" x="1102" y="740" width="282" height="84" rx="8"/>
    <text class="label" x="1120" y="768">Fish Audio &#183; live TTS</text>
    <text class="mono" x="1120" y="793">s2.1-pro-free</text>
    <text class="small" x="1120" y="814">WebSocket &#183; streaming MP3</text>

    <text class="detail" x="1102" y="893">API keys stay in the backend.</text>
    <text class="small" x="1102" y="920">Model labels show source defaults;</text>
    <text class="small" x="1102" y="943">chat / planner can be configured.</text>
  </g>

  <g aria-label="Optional Vision Monitor dashboard and bridge">
    <rect class="node" x="56" y="1120" width="256" height="92" rx="8"/>
    <text class="label" x="72" y="1149">Dashboard &#183; :5174</text>
    <text class="detail" x="72" y="1175">Previews, logs, costs, settings</text>
    <text class="small" x="72" y="1198">Capture interval / buffer / tokens</text>
    <rect class="node" x="56" y="1240" width="256" height="88" rx="8"/>
    <text class="label" x="72" y="1269">Node bridge &#183; :3001</text>
    <text class="mono" x="72" y="1294">/ws-monitor</text>
    <text class="small" x="72" y="1317">Telemetry / settings relay</text>
    <text class="mono" x="56" y="1356">Backend: /ws?role=monitor</text>
    <text class="small" x="56" y="1377">Observer connection; no selfie snapshots</text>
  </g>

  <g aria-label="Implemented local image providers">
    <rect class="photo" x="452" y="1118" width="914" height="52" rx="8"/>
    <text x="909" y="1150" fill="#f9a8d4" font-size="19" font-weight="600" text-anchor="middle">AUTO ORDER: 1. ComfyUI &#8594; 2. managed ComfyUI &#8594; 3. sd.cpp</text>
    <rect class="photo" x="452" y="1188" width="282" height="96" rx="8"/>
    <text class="label" x="470" y="1217">Existing ComfyUI</text>
    <text class="mono" x="470" y="1243">127.0.0.1:8188 &#183; HTTP + WS</text>
    <text class="small" x="470" y="1268">Workflow / reference / progress</text>
    <rect class="photo" x="768" y="1188" width="282" height="96" rx="8"/>
    <text class="label" x="786" y="1217">Managed ComfyUI</text>
    <text class="detail" x="786" y="1243">Owned Python &#183; auto local port</text>
    <text class="small" x="786" y="1268">Unload + 90 s idle shutdown</text>
    <rect class="photo" x="1084" y="1188" width="282" height="96" rx="8"/>
    <text class="label" x="1102" y="1217">sd.cpp</text>
    <text class="detail" x="1102" y="1243">sd-cli &#183; CUDA / Vulkan</text>
    <text class="small" x="1102" y="1268">Memory preflight + telemetry</text>
    <rect class="photo" x="452" y="1310" width="914" height="50" rx="8"/>
    <text class="detail" x="470" y="1341">Local photo files &#8594; backend token delivery &#183; ETA, limits, and telemetry persist in data/</text>
  </g>

  <!-- Path styles identify behavior, rather than implementation status. -->
  <line class="main-flow" x1="48" y1="1426" x2="86" y2="1426" marker-end="url(#arrow-blue)"/>
  <text class="detail" x="99" y="1432">Conversation / API calls</text>
  <line class="optional-flow" x1="382" y1="1426" x2="420" y2="1426" marker-end="url(#arrow-gray)"/>
  <text class="detail" x="433" y="1432">Optional / continuous vision</text>
  <line class="photo-flow" x1="764" y1="1426" x2="802" y2="1426" marker-end="url(#arrow-pink)"/>
  <text class="detail" x="815" y="1432">Implemented PAP flow</text>
  <text class="small" x="1102" y="1432">Bidirectional = request / result</text>
</svg>
