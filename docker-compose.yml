services:
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # The proxy trusts this local-only publication; never bind these to 0.0.0.0.
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:5174:5174"
    env_file:
      - .env
    environment:
      PORT: "8787"
      WAIFU_DATA_DIR: /app/data
      WAIFU_LOCAL_DIR: /app/local
      WAIFU_ALLOW_PLAINTEXT_SECRETS: ${WAIFU_ALLOW_PLAINTEXT_SECRETS:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/app/data
      - app-local:/app/local
      - app-config:/app/config
      - app-models:/app/public/models
      - app-references:/app/assets/references

volumes:
  app-data:
  app-local:
  app-config:
  app-models:
  app-references:
